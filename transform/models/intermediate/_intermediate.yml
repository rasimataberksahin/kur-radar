version: 2
models:
  - name: int_series_daily
    description: All modelled price series in long form (series_id, obs_date, value).
    data_tests:
      - unique_combination: {arguments: {columns: [series_id, obs_date]}}
    columns:
      - name: series_id
        data_tests:
          - accepted_values:
              arguments: {values: [USDTRY, EURTRY, GRAMTRY, XAUUSD, EURUSD]}
      - name: value
        data_tests: [not_null]
  - name: int_series_features
    description: Backward-looking return, volatility and trend features per series.
    data_tests:
      - unique_combination: {arguments: {columns: [series_id, obs_date]}}
