name: kurradar

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kurradar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kurradar_local}
      POSTGRES_DB: ${POSTGRES_DB:-kurradar}
    ports:
      - "127.0.0.1:55460:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kurradar} -d ${POSTGRES_DB:-kurradar}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
