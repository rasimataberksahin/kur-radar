name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline (python)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kurradar
          POSTGRES_PASSWORD: kurradar_local
          POSTGRES_DB: kurradar_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U kurradar -d kurradar_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://kurradar:kurradar_local@localhost:5432/kurradar_test
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      # -rs prints skip reasons so a silently skipped DB suite is visible.
      # test_dbt.py builds the real dbt project (transform/) on fixture data here.
      - run: pytest -q -rs

  # api (.NET 10) and desktop (Electron + React) jobs are added in stages 7 and 8.
