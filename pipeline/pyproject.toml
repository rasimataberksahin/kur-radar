[project]
name = "kurradar"
version = "0.1.0"
description = "KurRadar data pipeline: TCMB FX + gold ingestion, dbt, Dagster, ML"
requires-python = ">=3.12"
dependencies = [
    "dbt-core>=1.10,<2",
    "dbt-postgres>=1.9,<2",
    "defusedxml>=0.7",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
kurradar = "kurradar.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"kurradar.db.migrations" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "db: needs PostgreSQL at TEST_DATABASE_URL (skipped otherwise)",
    "dbt: runs the dbt project against the test database (slow)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
